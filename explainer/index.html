<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAROS: how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper: oklch(97.4% 0.01 75);
  --paper-2: oklch(94.2% 0.014 75);
  --paper-3: oklch(90.5% 0.018 75);
  --ink: oklch(23% 0.02 40);
  --ink-2: oklch(41% 0.02 40);
  --ink-3: oklch(59% 0.016 40);
  --line: oklch(85% 0.014 75);
  --core: oklch(57% 0.17 33);
  --core-t: oklch(92.5% 0.045 35);
  --derived: oklch(52% 0.06 250);
  --good: oklch(54% 0.12 150);
  --warn: oklch(56% 0.18 25);
  --ease: cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
header{padding-top:30px}
.top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.kicker{font-family:"JetBrains Mono",monospace;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,4.6vw,60px);line-height:.98;letter-spacing:-.02em;margin:8px 0 12px}
h1 em{font-style:normal;color:var(--core)}
.lede{max-width:66ch;color:var(--ink-2);margin:0 0 6px}
.acr{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0 0;padding:0;list-style:none}
.acr li{max-width:23ch;font-size:14.5px;color:var(--ink-2)}
.acr b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px;color:var(--ink)}
.acr b span{color:var(--core)}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;height:max-content}
.lang button{border:0;background:transparent;padding:7px 14px;font:inherit;font-size:15px;color:var(--ink-2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--paper-3);color:var(--ink);font-weight:700}
nav.groups{margin-top:26px;display:grid;grid-template-columns:repeat(6,minmax(0,auto));gap:10px 26px;align-items:start}
.grp h4{margin:0 0 6px;font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.grp div{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:14.5px;cursor:pointer;text-align:left;transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)}
.chip b{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3);margin-right:6px}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--core);border-color:var(--core);color:var(--paper)}
.chip[aria-pressed="true"] b{color:var(--core-t)}
.bar{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.play{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer}
.play[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.progress{flex:1;height:3px;background:var(--paper-3);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--core);transition:width .5s var(--ease)}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:30px;padding-bottom:44px;align-items:start}
.stage{background:var(--paper-2);border-radius:22px;position:relative;overflow:hidden}
svg{display:block;width:100%;height:auto}
.cap{position:absolute;left:22px;right:22px;bottom:16px;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-2)}
.panel h2{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(26px,2.4vw,34px);line-height:1.08;margin:6px 0 12px;letter-spacing:-.01em}
.panel .no{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--core);letter-spacing:.06em}
.panel .p{font-size:19px;margin:0 0 16px;max-width:60ch}
.panel h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 4px}
.panel ul{margin:0;padding-left:20px;display:grid;gap:5px;max-width:62ch}
.panel .why{margin:0;max-width:62ch;color:var(--ink-2)}
.panel .ana{margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--core-t)}
.panel .ana b{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--core);margin-bottom:3px}
.navrow{display:flex;gap:10px;margin-top:22px}
.navrow button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;cursor:pointer}
footer{border-top:1px solid var(--line);padding:16px 0 30px;color:var(--ink-3);font-size:14px}
/* scene primitives */
.f{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.6}
.md{fill:var(--paper);stroke:var(--core);stroke-width:2}
.mdt{font-family:"JetBrains Mono",monospace;font-size:13px;fill:var(--core);font-weight:600}
.dv{fill:none;stroke:var(--derived);stroke-width:1.8;stroke-dasharray:5 4}
.dvt{font-family:"JetBrains Mono",monospace;font-size:12.5px;fill:var(--derived)}
.lbl{font-family:"Atkinson Hyperlegible",sans-serif;font-size:15px;fill:var(--ink)}
.sm{font-family:"JetBrains Mono",monospace;font-size:12px;fill:var(--ink-3)}
.big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;fill:var(--ink)}
.arr{fill:none;stroke:var(--ink-2);stroke-width:2;marker-end:url(#ah)}
.arr-core{fill:none;stroke:var(--core);stroke-width:2.4;marker-end:url(#ahc)}
.arr-bad{fill:none;stroke:var(--warn);stroke-width:2.4;marker-end:url(#ahw)}
.in{opacity:0;animation:in .7s var(--ease) forwards}
.draw{stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400);animation:draw 1s var(--ease) forwards}
.out{animation:out 1.2s var(--ease) forwards}
.pulse{animation:pulse 2.4s var(--ease) infinite}
.loopmove{animation:loopmove 3.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(.08);animation:grow 3.6s var(--ease) infinite}
.sweep{animation:sweep 3.2s var(--ease) infinite alternate}
.blink{animation:blink 1.6s steps(2,start) infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes out{to{opacity:.18}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes grow{0%{transform:scaleX(.08)}60%,100%{transform:scaleX(1)}}
@keyframes sweep{from{transform:translateY(0)}to{transform:translateY(250px)}}
@keyframes blink{to{visibility:hidden}}
@media (max-width:1100px){nav.groups{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .wrap{padding:0 16px}
  main{grid-template-columns:1fr}
  nav.groups{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lang{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .in,.draw,.out,.pulse,.loopmove,.grow,.sweep,.blink{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <div>
      <div class="kicker" data-i="kicker"></div>
      <h1 data-i="h1"></h1>
      <p class="lede" data-i="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="hu">Magyar</button>
      <button data-lang="en">English</button>
    </div>
  </div>
  <ul class="acr" id="acr"></ul>
  <nav class="groups" id="groups" aria-label="Principles"></nav>
  <div class="bar">
    <button class="play" id="play" aria-pressed="false"></button>
    <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  </div>
</header>

<main>
  <div class="stage">
    <svg id="scene" viewBox="0 0 760 540" role="img" aria-live="polite">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="oklch(41% 0.02 40)"/></marker>
        <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="oklch(57% 0.17 33)"/></marker>
        <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="oklch(56% 0.18 25)"/></marker>
      </defs>
      <g id="sc"></g>
    </svg>
    <div class="cap" id="cap"></div>
  </div>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<footer data-i="foot"></footer>
</div>

<script>
const T={
 hu:{
  kicker:'PAROS · Personal Agentic Retrieval Operating System',
  h1:'Egy mappa jegyzet, ami <em>gondolkodó</em> operációs rendszerré válik',
  lede:'A PAROS egy módszer: a tudásod markdown-fájlokban él, és AI-agentek dolgoznak benne. Keresnek, rendet tartanak, és minden javításodból tanulnak. Válassz egy alapelvet, vagy indítsd el a bemutatót.',
  acr:[['P','ersonal','Egy emberé. Egy író, alapból privát.'],['A','gentic','Agentek dolgoznak benne: olvasnak, keresnek, tanulnak.'],['R','etrieval','A tudás annyit ér, amennyit a jó pillanatban vissza tudsz hozni.'],['OS','','Réteg, nem alkalmazás: az életed minden területe erre épül.']],
  groups:['Alap','Tudás','Látvány','Agentek','Keresés és kapcsolat','Biztonság és egészség'],
  play:'Bemutató indítása',stop:'Bemutató megállítása',prev:'Előző',next:'Következő',
  principle:'Alapelv',why:'Miért',practice:'A gyakorlatban',analogy:'Analógia',
  foot:'A PAROS Advisor nyílt forrású: github.com/ExarLabs/paros-advisor. A rajzok egyszerűsítések; a pontos szöveg a repó principles/ mappájában van.'
 },
 en:{
  kicker:'PAROS · Personal Agentic Retrieval Operating System',
  h1:'A folder of notes that becomes a <em>thinking</em> operating system',
  lede:'PAROS is a method: your knowledge lives in markdown files and AI agents work inside it. They find things, keep order, and learn from every correction you make. Pick a principle, or start the tour.',
  acr:[['P','ersonal','One person. One writer, private by default.'],['A','gentic','Agents work in it: they read, search and learn.'],['R','etrieval','Knowledge is worth what you can bring back at the right moment.'],['OS','','A layer, not an app: every area of your life builds on it.']],
  groups:['Foundation','Knowledge','View','Agents','Search and connection','Safety and health'],
  play:'Start the tour',stop:'Stop the tour',prev:'Previous',next:'Next',
  principle:'Principle',why:'Why',practice:'In practice',analogy:'Analogy',
  foot:'The PAROS Advisor is open source: github.com/ExarLabs/paros-advisor. The drawings are simplifications; the exact wording lives in the repository\'s principles/ folder.'
 }
};
const G=[0,0,1,2,3,3,3,4,5,4,1,1,5,0];
const P=[
 {id:'P00',g:0,
  hu:{t:'Egy PAROS, egy ember; alkotmány és biztonsági határok',p:'Egy PAROS egy ember kihelyezett gondolkodása. Vannak szabályok, amiken semmilyen automatizmus, tanulás vagy agent nem lazíthat.',w:'Egy önmagát változtató rendszerben csak akkor bízhatsz, ha egy része önmaga által nem írható át.',x:['Biztonsági határok: küldés, publikálás, törlés, pénz, hitelesítő adat, külső írás. Mindig a gazda kifejezett igenje kell.','A fontos fájlok „Alkotmány" szakaszát csak a gazda írja; a tanulás nem nyúl hozzá.'],a:'Mint egy ország alkotmánya: a parlament (a tanulás) sok törvényt módosíthat, az alkotmányt nem.',c:'Az agent nekifut a határnak, és visszapattan.'},
  en:{t:'One PAROS, one person; a constitution and safety boundaries',p:'A PAROS is one person\'s externalised thinking. Some rules cannot be loosened by any automation, learning or agent.',w:'A system that changes itself can only be trusted if part of it cannot be rewritten by itself.',x:['Safety boundaries: sending, publishing, deleting, money, credentials, writing to external systems. Always an explicit yes from the owner.','A "Constitution" section in important files is written only by the owner; learning never touches it.'],a:'Like a country\'s constitution: parliament (learning) can change many laws, but not the constitution.',c:'The agent runs into the boundary and bounces back.'}},
 {id:'P01',g:1,
  hu:{t:'A tudás markdownban (és JSON-ban) él; minden más származtatott',p:'A tudás forrása a markdown, mert ember és AI egyaránt olvassa és írja. Adatbázis, keresőindex, gyorsítótár, PDF: mind származtatott, és bármikor újraépíthető.',w:'A markdown nem öregszik, nem zár be egy alkalmazásba, és minden AI-modell olvassa. Ha az igazság adatbázisban élne, a tudásod egy eszköz foglya lenne.',x:['Minden fájl frontmatterrel kezdődik; a legfontosabb mező a description, ebből dönti el az agent, megéri-e megnyitni.','Beérkező eredetiből (PDF, táblázat, hang) markdown-kísérő készül, és onnan dolgozunk.'],a:'Mint a kotta és az előadás: a kotta az igazság, és minden előadás újrajátszható belőle.',c:'A származtatott elemek eltűnnek, majd a markdownból újraépülnek.'},
  en:{t:'Knowledge lives in markdown (and JSON); everything else is derived',p:'The source of knowledge is markdown, because both people and AI read and write it. Databases, search indexes, caches and PDFs are derived and can be rebuilt at any time.',w:'Markdown does not age, does not lock you into an application, and every AI model reads it. If the truth lived in a database, your knowledge would be the prisoner of a tool.',x:['Every file starts with frontmatter; the key field is description, which tells an agent whether a file is worth opening.','Incoming originals (PDF, spreadsheet, audio) get a markdown companion, and work continues from it.'],a:'Like sheet music and performances: the score is the truth, and every performance can be replayed from it.',c:'The derived pieces vanish, then rebuild from the markdown.'}},
 {id:'P02',g:2,
  hu:{t:'A megjelenítés HTML: élő nézet, ami markdownba ír vissza',p:'Amit az ember néz, az HTML: weboldal, gráf, interaktív nézet. Markdownból olvas, és ha ír, markdownba ír; saját tudástára nincs.',w:'A markdown jó tárolásra, rossz áttekintésre. A HTML adja az áttekintést, a markdown marad az igazság.',x:['Élő nézet: magától frissül, és mutatja a forrását és frissességét.','Pillanatkép (PDF, deck): nem frissül, ezért dátum és forrás van rajta.'],a:'Mint a kirakat és a raktár: a kirakat szép, de az áru a raktárban van, és onnan pótolják.',c:'A markdownból nézet lesz; a nézetből a pipa visszaíródik a markdownba.'},
  en:{t:'Presentation is HTML, a live view that writes back to markdown',p:'What people look at is HTML: a page, a graph, an interactive view. It reads from markdown and writes back to markdown; it has no knowledge store of its own.',w:'Markdown is good for storing and bad for overview. HTML gives the overview; markdown stays the truth.',x:['A live view updates itself and shows its source and freshness.','A snapshot (PDF, deck) does not update, so it carries its date and source.'],a:'Like a shop window and a storeroom: the window looks good, but the goods live in the storeroom.',c:'Markdown becomes a view; a tick in the view writes back to markdown.'}},
 {id:'P03',g:3,
  hu:{t:'Az agent nézőpont a vaulton, nem külön program',p:'Az agent egy nézőpont (például „emberek", „pénz", „marketing"). Egy fájlban él: térkép, szabályok, hozzáállás. Akkor kell, ha a nézőpont több területen átvág.',w:'A vault területek szerint tagolódik (függőlegesen), az agent keresztbe vág (vízszintesen). Kevés mély nézőpont kell, nem sok sekély szerep.',x:['A fő session felveheti a nézőpontot a fájl beolvasásával.','Külön futás csak hat okból éri meg: kontextus-védelem, párhuzamosság, függetlenség, felügyelet nélküli futás, olcsóbb modell, szűk jog.'],a:'Mint a szemüveg: ugyanazt a házat nézheted villanyszerelő- vagy vízvezeték-szerelő-szemmel; a ház ugyanaz.',c:'A területek oszlopok; a nézőpont vízszintesen végigpásztázza őket.'},
  en:{t:'An agent is a viewpoint on the vault, not a separate program',p:'An agent is a viewpoint (for example "people", "money", "marketing"). It lives in one file: a map, rules and an attitude. You need one when a viewpoint cuts across several areas.',w:'A vault is organised by areas (vertical); an agent cuts across them (horizontal). A few deep viewpoints, not many shallow roles.',x:['The main session can take on a viewpoint by reading its file.','A separate run is worth it for six reasons only: context protection, parallelism, independence, unattended runs, a cheaper model, narrow permissions.'],a:'Like a pair of glasses: you can look at the same house as an electrician or as a plumber; the house is the same.',c:'Areas are columns; the viewpoint sweeps across them.'}},
 {id:'P04',g:3,
  hu:{t:'Vékony belépő, élő markdown-definíció',p:'Minden agent és skill két részből áll: egy vékony belépőből (név, mikor kell, hová mutat) és egy élő, verziózott definícióból a vaultban. A belépő mindig az élőt olvassa: a vault nyer.',w:'Ha a tudás a platform saját fájljaiban élne, nem tanulna, nem lenne verziózva, és platformváltáskor elveszne.',x:['Skill: CURRENT.md (élő definíció), LEARNINGS.md (napló), observations/ (tanulási inbox), versions/ (régi változatok).','Ami lépésekben leírható, az skill, nem agent-szöveg.'],a:'Mint a névjegy és az életrajz: a névjegy rövid és csak mutat; az életrajz él és bővül.',c:'A kis belépő mindig a nagy, élő dokumentumra mutat; a verziószám nő.'},
  en:{t:'Thin entry point, live markdown definition',p:'Every agent and skill has a thin entry (name, when to use it, where it points) and a live, versioned definition in the vault. The entry always reads the live one: the vault wins.',w:'If the knowledge lived in the platform\'s own files, it would not learn, would not be versioned, and would be lost when you change platforms.',x:['A skill: CURRENT.md (live definition), LEARNINGS.md (log), observations/ (learning inbox), versions/ (old versions).','Anything that can be written as steps is a skill, not agent text.'],a:'Like a business card and a CV: the card is short and only points; the CV lives and grows.',c:'The small entry always points to the big, living document; the version number grows.'}},
 {id:'P05',g:3,
  hu:{t:'Zárt hurkú tanulás: a használat tanít, súlyozott tudással',p:'Minden interakció tanulási lehetőség. Amikor javítasz, elutasítasz vagy jobb utat mutatsz, az nem vész el: visszaépül a skillekbe. A tanult tudásnak súlya van, a használat erősíti vagy gyengíti.',w:'A rendszerek eddig vakok voltak a felhasználói visszajelzésre, vagy a hurok bezárása hónapokba és egy csapatba került. Itt a tanulság ott születik, ahol a munka, és perceken belül beépül.',x:['Észlelés: a futó agent tanulási csomagot ír (kontextus, tanulság, javasolt változás, bizonyíték).','Ellenőrzés: egy gondnok-nézőpont bizonyítékot kér; egy független bíra is megítéli; kód építi be.'],a:'Mint inas és mester: minden javításból tanul, és ami sokszor beválik, az beidegződik.',c:'Interakció, tanulság, ellenőrzés, és a szabály súlya megnő.'},
  en:{t:'Closed-loop learning: use teaches, with weighted knowledge',p:'Every interaction is a chance to learn. When you correct, reject or show a better way, it does not disappear: it goes back into the skills. Learned knowledge has weight, and use strengthens or weakens it.',w:'Systems used to be blind to user feedback, or closing the loop took months and a team. Here the lesson is born where the work happens and is integrated within minutes.',x:['Detection: the running agent writes a learning packet (context, lesson, proposed change, evidence).','Review: a caretaker viewpoint requires evidence; an independent judge weighs in; code applies it.'],a:'Like an apprentice and a master: it learns from every correction, and what works often becomes habit.',c:'Interaction, lesson, review, and the rule\'s weight grows.'}},
 {id:'P06',g:4,
  hu:{t:'A keresés képesség, index elsőként',p:'A vaultban keresni egy képesség (skill), nem agent. Előbb egy friss, rangsorolt teljes szöveges index; a nyers fájlkeresés csak pontos szövegre és kódra.',w:'Nagy vaultban a nyers keresés lassú, zajos, és felemészti a kontextust. Mérve: az index sokkal gyakrabban hozza elsőnek a jó választ.',x:['A kérdésből 2-4 jellemző szótő lesz; a cím és a leírás többet ér, mint a törzs.','Ha sok fájlt kell együtt olvasni, egy kontextus-védő munkás csinálja és csak összegzést ad vissza.'],a:'Mint a könyvtári katalógus: nem járod végig a polcokat, hanem megnézed, hol van.',c:'Kérdés, index, és a legjobb találat kerül előre.'},
  en:{t:'Search is a capability, index first',p:'Searching the vault is a capability (a skill), not an agent. First a fresh, ranked full-text index; raw file search only for exact strings and code.',w:'In a large vault raw search is slow, noisy and eats context. Measured: the index puts the right answer first far more often.',x:['Turn the question into 2 to 4 word stems; title and description weigh more than the body.','If many files must be read together, a context-protecting worker does it and returns a summary.'],a:'Like a library catalogue: you do not walk every shelf, you look it up.',c:'A question, the index, and the best hit rises to the top.'}},
 {id:'P07',g:5,
  hu:{t:'A titok a vaulton kívül él, titkosítva utazik, érték nélkül leltározzuk',p:'Minden kapcsolat egy titkon múlik (API-kulcs, token, jelszó). Az érték soha nem kerül a vaultba, a chatbe vagy az agent kontextusába; a vaultban csak a leltár van.',w:'A vault szinkronizál, indexelődik, és AI olvassa: ami oda kerül, az kiszivárgott. Agent-rendszerben ráadásul maga az agent is kiküldhetne egy titkot.',x:['Négy réteg: a gép titoktára, titkosított átviteli csomag, érték nélküli leltár, és a futásidejű betöltés.','Új titok = új leltársor (mire való, ki használja, milyen jogkör).'],a:'A kulcs nincs a lábtörlő alatt: a házban csak a kulcsok listája lóg, a kulcsok a széfben vannak.',c:'A kulcs kint marad a széfben; bent csak a lista látszik.'},
  en:{t:'Secrets live outside the vault, travel encrypted, and are inventoried without values',p:'Every connector depends on a secret (API key, token, password). The value never goes into the vault, the chat or the agent\'s context; the vault only holds the inventory.',w:'The vault syncs, gets indexed and is read by AI: a secret placed there is a leaked secret. In an agent system the agent itself could even send it out.',x:['Four layers: the machine\'s keychain, an encrypted transfer bundle, an inventory without values, and loading at run time.','A new secret means a new inventory line (what for, who uses it, which scope).'],a:'The key is not under the doormat: inside the house hangs only the list of keys; the keys are in the safe.',c:'The key stays in the safe outside; inside only the list is visible.'}},
 {id:'P08',g:4,
  hu:{t:'Kapcsolatok: a SaaS a gerinc, az AI a ragasztó',p:'A külső szolgáltatásoknak (levél, naptár, tárhely, CRM, ERP) megvan a helyük, és az AI nem váltja ki őket. Együtt szupererő.',w:'A SaaS gyors, olcsó és determinisztikus; az AI lassabb és drágább, de érti a szándékot és összeköt. Mindegyik azt csinálja, amiben jó.',x:['A közös dolgok (a cég, a csapat) a közös eszközökben élnek; a PAROS connectoron át éri el őket.','Pull és publish tudatos lépés, soha nem automatikus.'],a:'Mint a csontváz és az ízületek: a SaaS a csont, ami tart; az AI az ízület, ami mozgat.',c:'Szolgáltatások körben; az AI szálakkal köti össze őket.'},
  en:{t:'Connectors: SaaS is the backbone, AI is the glue',p:'External services (mail, calendar, storage, CRM, ERP) have their place, and AI does not replace them. Together they are a superpower.',w:'SaaS is fast, cheap and deterministic; AI is slower and costlier but understands intent and connects things. Each does what it is good at.',x:['Shared things (the company, the team) live in shared tools; PAROS reaches them through connectors.','Pull and publish are deliberate steps, never automatic.'],a:'Like bones and joints: SaaS is the bone that holds; AI is the joint that moves.',c:'Services in a circle; AI ties them together.'}},
 {id:'P09',g:1,
  hu:{t:'Felejtés: halványul, archiválódik, nem törlődik',p:'A markdown alig foglal helyet, ezért törölni nem kell. A tudás halványul, nem tűnik el; ami lezárult, archiválódik.',w:'A törölt tudás nem jön vissza, az archivált igen. Egy tanuló rendszerben a „régi" néha újra fontos lesz.',x:['A használatlan szabály súlyt veszít; az alvó szabály nem töltődik be, de megmarad.','Ami lezárult, Archive/ mappába kerül, dátummal és egy mondatnyi okkal.'],a:'Padlás, nem szemétégető: ami ma nem kell, felkerül, és bármikor lehozható.',c:'A fájlok elhalványulnak, és az archívumba vándorolnak; semmi nem tűnik el.'},
  en:{t:'Forgetting: fade, archive, do not delete',p:'Markdown takes very little space, so deleting is not necessary. Knowledge fades, it does not vanish; what is finished is archived.',w:'Deleted knowledge does not come back; archived knowledge does. In a learning system "old" sometimes becomes important again.',x:['Unused rules lose weight; a dormant rule is no longer loaded but stays.','Finished things go to an Archive/ folder with a date and a one-sentence reason.'],a:'An attic, not an incinerator: what you do not need today goes up, and can come down any time.',c:'Files fade and move to the archive; nothing disappears.'}},
 {id:'P10',g:1,
  hu:{t:'Mentés: a szinkron nem mentés',p:'A szinkron arra való, hogy két helyen legyél egyszerre; a mentés arra, hogy visszamehess az időben. A szinkron a törlést, a hibás agent-írást vagy a zsarolóvírust is hűen lemásolja.',w:'Agent-rendszerben a gyors tömeges írás normális működés; egy rossz írás percek alatt minden gépre eljut.',x:['Csak azt mentsd, ami pótolhatatlan: a vault, a titokcsomag és a helyreállító kulcs, a session-átiratok, a saját média.','3-2-1: három másolat, kétféle hordozón, egy a házon kívül.'],a:'A tükör nem napló: a tükör a hibát is mutatja; a mentés időgép.',c:'A hibás írás végigmegy a szinkronon; a mentés pillanatképeiből visszaléphetsz.'},
  en:{t:'Backup: sync is not backup',p:'Sync is for being in two places at once; backup is for going back in time. Sync faithfully copies a deletion, a bad agent write or a ransomware-encrypted file.',w:'In an agent system fast bulk writing is normal; one bad write reaches every machine in minutes.',x:['Back up only what cannot be replaced: the vault, the secrets bundle and recovery key, session transcripts, your own media.','3-2-1: three copies, two kinds of media, one off-site.'],a:'A mirror is not a diary: the mirror shows the mistake too; a backup is a time machine.',c:'A bad write spreads through sync; backup snapshots let you step back.'}},
 {id:'P11',g:5,
  hu:{t:'Nincs „működik" bizonyíték nélkül',p:'Egy folyamat akkor egészséges, ha egy valódi bemenet ténylegesen a várt kimenetet adja, nem akkor, ha fut, vagy ha a dokumentáció szerint létezik.',w:'Személyes agent-rendszerben a domináns hiba a néma hiba: egy index hónapokig nem frissül, és semmi nem jelez.',x:['Kanári: egy futás egyedi jelet ír egy jegyzetbe, a következő keresi az indexben. Ha megvan, az írás, a figyelés, az indexelés és a keresés is működik.','Súlyozott ellenőrzések: az index frissessége, a mentés kora, nincs titok a vaultban.'],a:'Mint a bányászkanári: amíg énekel, a levegő jó; ha elhallgat, azonnal tudod.',c:'Jel be, jel az indexben, zöld pipa.'},
  en:{t:'No "it works" without proof',p:'A process is healthy when a real input actually produces the expected output, not when it is running or when the documentation says it exists.',w:'The dominant failure in a personal agent system is the silent one: an index does not refresh for months, and nothing signals it.',x:['Canary: one run writes a unique marker into a note; the next looks for it in the index. If found, writing, watching, indexing and search all work.','Weighted checks: index freshness, backup age, no plain secrets in the vault.'],a:'Like the canary in the coal mine: while it sings, the air is fine; when it stops, you know at once.',c:'Marker in, marker in the index, green tick.'}},
 {id:'P12',g:0,
  hu:{t:'Egy tény, egy gazda',p:'Minden ténynek pontosan egy hiteles helye van. Minden más előfordulás hivatkozás, vagy kifejezetten származtatott másolat (forrással és dátummal).',w:'Ha ugyanaz a tény két helyen él, előbb-utóbb elcsúsznak, és senki nem tudja, melyik igaz. Egy AI magabiztosan idézi mindkettőt.',x:['Egy forrástérkép megmondja adatfajtánként, mi a hiteles és mi a származtatott.','Az agentek listája egy helyen él; minden más dokumentum oda mutat.'],a:'Akinek két órája van, sosem tudja pontosan, mennyi az idő.',c:'Egy tény, egy gazda; a többi csak rámutat.'},
  en:{t:'One fact, one owner',p:'Every fact has exactly one authoritative place. Every other occurrence is a reference, or an explicitly derived copy (with its source and date).',w:'If the same fact lives in two places, they drift apart sooner or later, and nobody knows which is true. An AI will confidently quote both.',x:['A source map says, per kind of data, what is authoritative and what is derived.','The list of agents lives in one place; other documents link to it.'],a:'A person with two watches never quite knows the time.',c:'One fact, one owner; the rest only point to it.'}}
];

/* ---------- app ---------- */
let lang=(new URLSearchParams(location.search).get('lang'))||((navigator.language||'en').toLowerCase().startsWith('hu')?'hu':'en');
let cur=1,touring=null,timers=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function i18n(){
 document.documentElement.lang=lang;document.title=lang==='hu'?'PAROS: így működik':'PAROS: how it works';
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=T[lang][e.dataset.i]);
 document.getElementById('acr').innerHTML=T[lang].acr.map(([a,b,c])=>`<li><b><span>${a}</span>${b}</b>${c}</li>`).join('');
 const gw=document.getElementById('groups');
 gw.innerHTML=T[lang].groups.map((g,gi)=>`<div class="grp"><h4>${g}</h4><div>${P.map((p,i)=>p.g===gi?`<button class="chip" data-i2="${i}" aria-pressed="${i===cur}"><b>${p.id}</b>${short(p[lang].t)}</button>`:'').join('')}</div></div>`).join('');
 gw.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{stopTour();show(+b.dataset.i2)}));
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
 document.getElementById('play').textContent=touring?T[lang].stop:T[lang].play;
 show(cur,true);
}
function short(t){return t.split(/[;:,]/)[0]}
function show(i,keepTour){
 cur=i;timers.forEach(clearInterval);timers=[];
 const p=P[i],x=p[lang],t=T[lang];
 document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i2===i)));
 sc.innerHTML='';SCENES[p.id]();
 document.getElementById('cap').textContent=x.c;
 document.getElementById('panel').innerHTML=`<div class="no">${p.id} · ${t.groups[p.g]}</div><h2>${x.t}</h2><p class="p">${x.p}</p>
  <h3>${t.why}</h3><p class="why">${x.w}</p><h3>${t.practice}</h3><ul>${x.x.map(s=>`<li>${s}</li>`).join('')}</ul>
  <div class="ana"><b>${t.analogy}</b>${x.a}</div>
  <div class="navrow"><button id="pv">${t.prev}</button><button id="nx">${t.next}</button></div>`;
 document.getElementById('pv').onclick=()=>{stopTour();show((i+P.length-1)%P.length)};
 document.getElementById('nx').onclick=()=>{stopTour();show((i+1)%P.length)};
 document.getElementById('prog').style.width=((i+1)/P.length*100)+'%';
}
function stopTour(){if(touring){clearInterval(touring);touring=null;const b=document.getElementById('play');b.setAttribute('aria-pressed','false');b.textContent=T[lang].play}}
document.getElementById('play').addEventListener('click',e=>{
 if(touring){stopTour();return}
 const b=e.currentTarget;b.setAttribute('aria-pressed','true');b.textContent=T[lang].stop;
 show(0);touring=setInterval(()=>{if(cur>=P.length-1){stopTour();return}show(cur+1)},9000);
});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;i18n()}));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stopTour();show((cur+1)%P.length)}if(e.key==='ArrowLeft'){stopTour();show((cur+P.length-1)%P.length)}});
i18n();
</script>
